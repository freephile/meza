---

# Default Vagrant configuration for Meza.
# This file is used by Vagrant to set up a local virtual machine for Meza
# development and testing.
# COPY THIS FILE TO vagrantconf.yml AND MODIFY AS NEEDED, DO NOT EDIT THIS FILE DIRECTLY.

# Pick OS of box. Options: debian,rockylinux
box_os: rockylinux

# Option to use a non-standard base virtual machine. The `box_os` option above
# will pick a supported baseBox for you. Use this only if you want to try out
# other base boxes.
# baseBox: rockylinux/8

# The `app1` server is the main virtual machine, and in most cases will be the
# only VM.
app1:

  # How much RAM to give this box. Don't assign more than your computer has
  # available. Give it 4096 (4GB) if you can.
  memory: 4096

  # How many CPUs to give the VM. 1 is probably fine.
  cpus: 1

  # IP address of this VM. This is where you'll access the VM from your browser.
  # Access via: https://192.168.56.56/ (HTTPS only - Meza disables HTTP by default)
  ip_address: "192.168.56.56"


#
# AFTER VAGRANT UP:
# 1. Provisioning runs automatically (getmeza, setupenv, publicconfig)
# 2. Deploy: vagrant ssh to get into the VM then:
# sudo su - meza-ansible
# cd /opt/meza/config
# sudo meza deploy vagrant -vvv
# 3. Create first wiki: sudo meza create wiki vagrant
#    - Wiki ID: demo
#    - Wiki Name: Demo Wiki
#    - Admin Password: Must be 8+ chars with uppercase, lowercase, number, special char
#      Example: Vagrant123!
# 4. Access: https://192.168.56.56/demo (accept self-signed certificate warning)
#
# Note: Meza uses HTTPS by default. HTTP (port 80) is disabled.
# Note: First deploy does NOT automatically create a wiki - you must use 'meza create wiki'
#


#
# Additional servers for a multi-server setup. Only use these if you have a
# sufficiently powerful computer to handle the additional resources required.
#

# To add a second app server, uncomment the lines below
# app2:
#   memory: 512
#   cpus: 1
#   ip_address: "192.168.56.57"

# To add a second database server, uncomment the lines below
# db2:
#   memory: 512
#   cpus: 1
#   ip_address: "192.168.56.58"

# Install directory where Meza will be installed in the VM
# Default: /opt (which means Meza installed at /opt/meza)
# install_directory: "/opt"

# Note: VirtualBox shared folders are configured with proper permissions
# for the meza-ansible user. If you experience permission issues:
#   1. SSH into VM: vagrant ssh
#   2. Run: sudo bash /opt/meza/manual/fix-vbox-permissions.sh
#   3. Log out and back in: exit && vagrant ssh
# See manual/VBOX_PERMISSIONS.md for details
