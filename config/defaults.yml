---
# Meza default config file

# used by autodeployer to track a named branch, tag, or SHA1
# @FIXME when this is defined, you can not deploy with modifications in
# /opt/meza so you can not change anything
# add another 'enfoce_mode' variable, or a host!=localhost condition
# enforce_meza_version: REL1_39

# The source code repo for Meza
# e.g. Use our local repo fork temporarily
# meza_repository_url: https://github.com/freephile/meza.git
# You can override this using Ansible 'extra-vars'
# yamllint disable-line rule:line-length
# sudo time meza deploy monolith -vvv --tags base,httpd-reload -e meza_repository_url=https://github.com/freephile/meza.git
# Note: a similar variable is used in getmeza.sh
# That script (or git on the CLI) controls your meza sources currently.
# The variable here is NOT used to check out new versions of meza on deploys
# but rather used in playbooks/check-for-changes and roles/enforce-meza-version
# as part of the Autodeployer https://www.mediawiki.org/wiki/Meza/Autodeployer
meza_repository_url: https://github.com/freephile/meza.git

# Should composer install Dev Dependencies
# Toggle this to 'false' for any development
# 'true' Disables require-dev packages
m_disable_composer_dev_dependencies: false

# Production mode toggles opcache to ignore timestamps
# so live edits will NOT be seen without restarting the webserver or php-fpm.
# Production mode decreases opcache log verbosity to exclude warnings.
# Toggle this to 'false' for any development.
m_opcache_production_mode: false

m_httpd_server_admin: admin@example.com
m_timezone: America/New_York

# Poorly documented and not really used method to specify networking zone
m_private_networking_zone: public

meza_server_log_db: meza_server_log

use_ntp: true

ntp_server: [0.pool.ntp.org, 1.pool.ntp.org, 2.pool.ntp.org, 3.pool.ntp.org]

# Ensure group-writable files by default (umask 0002)
# Without this, restrictive umask (0022) on target systems creates
# files with 0644/0755 even when Ansible sets mode: "2775"
# Required for apache group to write to logs, cache, uploads
m_umask: "0002"

m_language: en

allow_backup_downloads: false

# Allow skipping certain wikis when doing backups
# Example:
# wikis_to_skip_overwrite
#   - mywiki
#   - yourwiki
wikis_to_skip_overwrite: []

# Declarative wiki configuration See https://github.com/freephile/meza/issues/101 for details.
# This replaces directory-based wiki discovery with explicit declarations
# Copy and modify this section in your local public.yml
# to define your wikis.
#
# wikis:
#   - id: demo
#     name: Demo Wiki
#     primary: true
#     database: wiki_demo  # defaults to wiki_{id}
#     redirects: []        # aliases that redirect to this wiki
#   - id: testwiki
#     name: Test Wiki
#     primary: false
#     redirects:
#       - oldwiki
#       - legacywiki

# Legacy support: Allow redirecting wiki IDs to other wikis.
# This is useful if wikis are renamed or merged.
# DEPRECATED: Use wikis[].redirects instead for new configurations
# Example:
# wiki_id_redirects:
#   eva: iss
#   oso: iss
#   robo: iss
wiki_id_redirects: {}

m_force_debug: false

# Parser cache type: CACHE_NONE, CACHE_MEMCACHED, CACHE_ACCEL, etc.
# See https://www.mediawiki.org/wiki/Manual:$wgParserCacheType
m_parser_cache_type: CACHE_NONE

enable_wiki_emails: true

# Enable the use of LetsEncrypt certificates
use_certbot: false

# Enable the use of Kibana as an interface to ElasticSearch
m_install_kibana: false

# HAProxy settings - differences here are only in cases where a
# more general use case defined in the role defaults is not sufficient or recommended for Meza's use case of MediaWiki hosting. For example, the default HAProxy role settings for rate limiting are very aggressive and would cause false positives on a MediaWiki site, so we set more reasonable defaults here. You can override these in conf-meza/public/public.yml or secret/<env>/secret.yml as needed.

# If enabled, haproxy stats would be visible at port 1936, over HTTPS
# you can curl -u 'admin:password' https://localhost:1936/haproxy?stats
# or just forward the port and open it a browser.

enable_haproxy_stats: false
haproxy_stats_user: admin
haproxy_stats_password: password
# how many requests per window to allow before blocking an IP. This is a counter in the HAProxy stick table.
# A single page in MediaWiki will make 40-100 requests depending on the number of resources
# 'regular' page (40) to Category page (60), to 'Special:NewFiles' (100)
haproxy_rate_limit_requests: 900
# how many IP addresses to track for rate limiting. This is a size of the "stick table" in HAProxy, not a hard limit on
# the number of IPs that can be blocked.
haproxy_rate_limit_table_size: "100k"
# Time window for rate limiting in HAProxy. This is the "expire" time for the stick table entries,
# and also the time window for the http_req_rate and http_err_rate counters.
haproxy_rate_limit_window: "10s"
# how many errors per window to allow before blocking an IP. This is a counter in the HAProxy stick table.
haproxy_rate_limit_errors: 20
# how many bytes per window to allow before blocking an IP. This is a counter in the HAProxy stick table.
# Note that this is a rate (bytes per window), not a total bytes limit.
# So an IP could request 10 MiB every 10 seconds and never be blocked.
# We DO NOT DEFINE THIS BY DEFAULT because category pages with many images easily exceed 10 MiB/10s.
# Which means we would be blocking legitimate traffic. If you have a need to block traffic by volume, you can simply
# enable it via haproxy_rate_limit_bytes_out if needed (plain integer bytes, e.g. 104857600 = 100 MiB).
#This is a counter in the HAProxy stick table.
# haproxy_rate_limit_bytes_out: 10485760

#
# PHP Profiling Configuration
#
# Meza uses xhprof with MediaWiki's built-in ProfilerXhprof for performance analysis.
# This is useful for developers and performance testing.
#
# HIERARCHICAL CONTROL:
# 1. Environment-level: Set m_setup_php_profiling in your environment config
#    - When true: Installs xhprof PHP extension
#    - When false: Extension not installed, per-wiki settings have no effect
#
# 2. Per-wiki level: Add enable_profiling to individual wiki definitions
#    - Only works if m_setup_php_profiling is true at environment level
#    - Allows selective profiling of specific wikis in dev environments
#
# 3. Output format: Controls where profiling data appears
#
# EXAMPLE CONFIGURATIONS:
#
# Test environment (profile all wikis):
#   /opt/conf-meza/public/public.yml:
#     m_setup_php_profiling: true
#     enable_profiling: true is implied for all wikis unless overridden per-wiki
#
# Dev environment (profile specific wikis by enabling per-wiki):
#   /opt/conf-meza/public/public.yml:
#     m_setup_php_profiling: true
#     wikis:
#       - id: demo
#         name: Demo Wiki
#         # you really only need to DISABLE profiling per-wiki if you want it OFF
#       - id: dev_test
#         enable_profiling: true
#       - id: production_test
#         name: Production Test
#         enable_profiling: false
#
# Production environment (profiling disabled for all wikis regardless of per-wiki settings):
# You can't enable what is not installed.
#   /opt/conf-meza/public/public.yml:
#     m_setup_php_profiling: false
#
# SECURITY WARNING:
# - ProfilerOutputText (footer mode) exposes internal performance data in page HTML
# - For production profiling (if needed), use file output mode or restrict to admin users
# - Recommend keeping m_setup_php_profiling: false in production environments
#
# See src/roles/apache-php/README_PROFILING.md for usage details

# Install xhprof extension and enable profiling capability
m_setup_php_profiling: false

# Profiling output type: 'footer' or 'file'
# - footer: Shows profiling data at bottom of each page (ProfilerOutputText)
# - file: Logs profiling data to files (ProfilerOutputFile)
m_profiling_output_type: footer

# Directory for profiling log files (when m_profiling_output_type: file)
m_profiling_file_path: "{{ m_data_logs_dir }}/profiler"

# Number of days to retain profiling log files
# Log rotation runs daily at 2:00 AM
m_profiling_file_retention_days: 1

# Enable slow query log
mysql_slow_query_log_enabled: true
mysql_slow_query_time: "5"
# mysql_slow_query_log_file: /var/log/mariadb/slow-queries.log

# Default to using the performance schema
# But allow it to be turned OFF easily in low mem environments
# or for high performance environments like prod
# http://dev.mysql.com/doc/refman/5.5/en/performance-schema.html
# https://mariadb.com/kb/en/mariadb/performance-schema-overview/
mysql_performance_schema: "on"

# Netdata is a monitoring and alerting system
m_install_netdata: false
# netdata runs on 19999 by default. We'll expose it at 20000
netdata_internal_port: 19999
netdata_external_port: 20000

# If false, keep all SQL files on backup servers. If true, only keep the latest
do_cleanup_sql_backup: false

# sshd_config defaults
sshd_config_UsePAM: "yes"
sshd_config_PasswordAuthentication: "yes"
use_default_ssh_config: false

m_modify_etc_sudoers: true
m_meza_sudoers_file: "/etc/sudoers.d/meza-ansible"

#
# Software versions
#

# Version of MediaWiki core. Normally a Release branch like REL1_43 is good.
# Using the 1.43.1 tag until the DBAL breakage is fixed in extensions.
# mediawiki_version: "1.43.6"  # You can use a branch, tag, or SHA1
mediawiki_version: "REL1_43"


# Depth of MediaWiki clone - to avoid having ALL the project history
mediawiki_git_depth: "100"

# Branch to use for extensions and skins without a more specific version
mediawiki_default_branch: "REL1_43"

# CAUTION: if set to true, a deploy will overwrite manual changes made on disk
# to MediaWiki core, Meza core extensions and skins + Local extensions and skins
# including any that are installed via composer.
# The default is true because you want things to be deterministic for production.
# You may want to override this in your public/public.yml for development flexibility.
# To determine ahead of time whether you have changes in composer-managed extensions
# You can run `composer status --verbose --working-dir=/opt/htdocs/mediawiki`.
# For git-managed core, extensions and skins you can run
# scripts/findDirtyDirs.sh
overwrite_local_changes: true

# PHP version
php_ius_version: "php81"
php_debian_version: "8.1"
php_memory_limit: "128M"  # 128M is default

# See Extension:CirrusSearch for ElasticSearch requirements
# Meza before 31.x had ElasticSearch 1.6 or 2.x
# Meza 31.x had 5.x
# Meza 32.x through 34.x were never released, but had 5.x or 6.x
# Meza 35.x uses 6.x
# Meza 39.x uses 7.x
elasticsearch_major_version: "7.x"

# Retry/backoff defaults for CirrusSearch/ForceSearchIndex calls during bulk indexing
# These can be overridden per-host/group via inventory, or via environment variables
# when running the script (RETRY_MAX, RETRY_INITIAL).
elasticsearch_index_retry_max: 5
elasticsearch_index_retry_initial: 5

# Whether or not to install Lua/luasandbox
m_install_lua: false

# This can't be in Debian.yml, because that is loaded prior to defaults.yml
packages_php_debian:
  - php{{ php_debian_version }}-common
  - php{{ php_debian_version }}-cli
  - php{{ php_debian_version }}-dev
  # - php{{ php_debian_version }}-fpm
  - libpcre3-dev
  - php{{ php_debian_version }}-gd
  - php{{ php_debian_version }}-curl
  - php{{ php_debian_version }}-imap
  # - php{{ php_debian_version }}-json
  - php{{ php_debian_version }}-opcache
  - php{{ php_debian_version }}-xml
  - php{{ php_debian_version }}-mbstring
  - php{{ php_debian_version }}-mysql
  - php{{ php_debian_version }}-odbc
  - php{{ php_debian_version }}-pspell
  - php{{ php_debian_version }}-snmp
  - php{{ php_debian_version }}-xmlrpc
  - php{{ php_debian_version }}-bcmath
  - php{{ php_debian_version }}-intl
  - php{{ php_debian_version }}-soap
  - php-sqlite3
  - php-apcu
  - php-pear
  - php-memcached

  # No PHP 7.2 version of this (just like with IUS)
  - php{{ php_debian_version }}-mcrypt

  # No apt package corresponding to:
  #   "{{ php_ius_version }}-process"
  #   "{{ php_ius_version }}-pdo"

# SAML
# The library version to install
# For MW 1.39, we need the library at 2.1.1 and PHP >=8.0
## @FIXME: changing library blows away the existing installation directory
## DO NOT CHANGE THIS WITHOUT BACKING UP YOUR CONFIG AND LOGS
simplesamlphp_version: "2.2.1"
# Extension:PluggableAuth 7.0
# Extension:SimpleSAMLphp 7.0
# These two extensions may diverge in their release naming
# (already has with 7.1.0 and 7.0.1) so we may need to make two config variables
saml_mw_extension_version: "tags/7.0.0"


#
# NOTIFICATIONS
#
server_performance_crontime: "*/10 * * * *"

# at what level do we display amber colored notification
server_performance_memory_usage_warning: "50"

# same as ^ but red danger message
server_performance_memory_usage_danger: "75"

disk_space_usage_crontime: "0 1 * * *"

# Icons display in Slack
# @FIXME: using new icons from Issue #270 but ServerPerformance should be removed
server_performance_notification_icon: |
  https://github.com/freephile/meza/raw/dev/src/roles/configure-wiki/files/logo.png
disk_space_usage_notification_icon: |
  https://github.com/freephile/meza/raw/dev/src/roles/configure-wiki/files/logo.png

# secret.yml has additional configuration options commented out. See that file
# for more details.


#
# Misc cron times
#

# Cleanup upload stash (temporary files) daily at 6pm
clean_upload_stash_crontime: "0 18 * * *"

#
# PHP config
#

# PHP max file size. This gets applied to php.ini variables upload_max_filesize
# and post_max_size for convenience.
php_max_upload_filesize: "5G"

# The OPcache shared memory storage size
php_opcache_memory_consumption: 256

# The amount of memory for interned strings in Mbytes
php_opcache_interned_strings_buffer: 16

# The amount of input variables that may be accepted
php_max_input_vars: 2000

# It's important for this number to be greater than the number of PHP files on a
# server.
# sudo find /opt/htdocs -type f -print | grep php | wc -l
#    On one server on 17-SEP-2018, 13859 files
# sudo find /opt/conf-meza -type f -print | grep php | wc -l
#    On one server on 17-SEP-2018, 134 files
# sudo find /opt/simplesamlphp -type f -print | grep php | wc -l
#    On one server on 17-SEP-2018, 5032 files
# total = ~19000 files
#
# This number could be increased based on the number of extensions in a server's
# MezaLocalExtensions.yml file. In order to leave plenty of room, pick a prime
# number about 50% bigger than 19000.
php_opcache_max_accelerated_files: 28001

# How often (in seconds) to check file timestamps for changes to the shared
# memory storage allocation. ("1" means validate once per second, but only
# once per request. "0" means always validate)
php_opcache_revalidate_freq: 0


#
# Memcached config
#

# Port to use
memcached_port: 11211

# Address memcached should listen on. For monolith/single-server use 127.0.0.1.
# For multi-server deployments where app_servers connect to a dedicated
# memcached host, set this to the private network IP of the memcached server
# (e.g. 10.0.1.5). Binding to 0.0.0.0 is insecure and enables amplification attacks.
memcached_listen: "127.0.0.1"

# Limit the number of simultaneous incoming connections.
memcached_max_connections: 1024

# Max amount of memory to use. Note that the daemon will grow to this size, but
# does not start out holding this much
memcached_memory: 512

# User to run memcached
# user_memcached: see RedHat.yml and Debian.yml

# TCP port on which to run php-fpm
#
m_php_fpm_port: 9000

#
# Helpers to group load balancer types
#

# All load balancer types
load_balancers_all: >
  {{
  ( groups.get('load_balancers', [] ) ) +
  ( groups.get('load_balancers_meza_internal', [] ) ) +
  ( groups.get('load_balancers_meza_external', [] ) ) +
  ( groups.get('load_balancers_nonmeza', [] ) ) +
  ( groups.get('load_balancers_nonmeza_internal', [] ) ) +
  ( groups.get('load_balancers_nonmeza_external', [] ) )
  }}


# Just load balancers for handling internal services
load_balancers_internal: >
  {{
  ( groups.get('load_balancers_meza_internal', [] ) ) +
  ( groups.get('load_balancers_nonmeza_internal', [] ) )
  }}

# Just load balancers for handling external traffic
load_balancers_external: >
  {{
  ( groups.get('load_balancers_meza_external', [] ) ) +
  ( groups.get('load_balancers_nonmeza_external', [] ) )
  }}

# Just load balancers that handle internal and external
load_balancers_full: >
  {{
  ( groups.get('load_balancers', [] ) ) +
  ( groups.get('load_balancers_nonmeza', [] ) )
  }}

# Just load balancers managed by Meza
load_balancers_meza: >
  {{
  ( groups.get('load_balancers', [] ) ) +
  ( groups.get('load_balancers_meza_internal', [] ) ) +
  ( groups.get('load_balancers_meza_external', [] ) )
  }}

# Just unmanaged load balancers (AWS, etc).
load_balancers_nonmeza: >
  {{
  ( groups.get('load_balancers_nonmeza', [] ) ) +
  ( groups.get('load_balancers_nonmeza_internal', [] ) ) +
  ( groups.get('load_balancers_nonmeza_external', [] ) )
  }}
