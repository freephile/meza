[defaults]
# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_debugger.html
# the debugger is set to false to disable Ansible debugging
# which can unintentionally cause normal deploys to stop and wait for user input
# if a task fails, but appear 'hung' because there is no indication that the 
# debugger is waiting for input.
# To enable the debugger for a deploy, set the environment variable 
# ANSIBLE_ENABLE_TASK_DEBUGGER to True when running the deploy command. For example:
# ANSIBLE_ENABLE_TASK_DEBUGGER=True sudo meza deploy monolith -vvv
enable_task_debugger = false

# # configure ARA
# callback_plugins=/usr/local/lib/python3.12/site-packages/ara/plugins/callback
# action_plugins=/usr/local/lib/python3.12/site-packages/ara/plugins/action
# lookup_plugins=/usr/local/lib/python3.12/site-packages/ara/plugins/lookup

# Configure profiling in Ansible to see task duration times
# https://docs.ansible.com/ansible/latest/plugins/callback/profile_tasks.html

# Use export ANSIBLE_LOAD_CALLBACK_PLUGINS=true to enable adhoc ansible commands
callbacks_enabled = profile_tasks
# add ara_default to the callbacks_enabled to enable ARA if it is installed and configured correctly
# callbacks_enabled = profile_tasks, ara_default

retry_files_save_path = /tmp

# used by ansible-galaxy and other commands
roles_path = ../src/roles

# collections_path = /root/.ansible/collections:/usr/share/ansible/collections:/root/.local/lib/python3.6/site-packages/ansible_collections
collections_path = ../collections

ansible_managed = Ansible managed from template {file} on controller {host} by user {uid}

ansible_user = meza-ansible

# Required if doing remote-to-remote communication (as opposed to
# controller-to-remote) without setting up keys between the remotes. This may
# not be ideal from a security perspective. Instead, there is a role for
# granting the controller's keys to remotes, and a separate role for revoking.
# [ssh_connection]
# ssh_args=-o ForwardAgent=yes

# human-readable stdout/stderr results display
# https://github.com/ansible/ansible/issues/27078
# options: debug, minimal, yaml
stdout_callback = debug

# Connect to one remote/parallel process at a time if you run out of memory
# using <= 2GB RAM host
# forks = 1

remote_tmp = /tmp/${USER}/ansible

# Makes deploys write to logs with color info. Puts extra characters into logs
# which is ugly when viewed in an editor (Vim) but looks better when you do
# `less -r /path/to/file` or similar commands.
force_color = 1

# Turn off deprecation warnings by setting this to 'False'
deprecation_warnings=True

# Uncomment to limit task profiling output
# [callback_profile_tasks]
## Limit number of tasks shown in the profile report
# task_output_limit = 20


[ssh_connection]

# Reduces SSH operations
# Fixes https://docs.ansible.com/ansible/latest/user_guide/become.html#becoming-an-unprivileged-user
# Works because `Defaults requiretty` not in /etc/sudoers
pipelining = True



# https://github.com/ansible/awx/issues/14495#issuecomment-1752708302
[galaxy]
server = https://old-galaxy.ansible.com/
