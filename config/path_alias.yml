---
# Path aliases for deprecated variables.
# New variable names should reference the existing canonical names so older
# configs keep working while the codebase migrates.

# Install
m_install_dir: "{{ m_install }}"

# App
m_app_dir: "{{ m_meza }}"
m_app_scripts_dir: "{{ m_scripts }}"
m_app_tests_dir: "{{ m_test }}"

# Config
m_config_dir: "{{ m_config_core }}"
m_config_deploy_dir: "{{ m_deploy }}"
m_config_i18n_dir: "{{ m_i18n }}"
m_config_public_dir: "{{ m_local_public }}"
m_config_secret_dir: "{{ m_local_secret }}"

# Data
m_data_dir: "{{ m_meza_data }}"
m_data_create_wiki_log_file: "{{ m_logs_create_wiki }}"
m_data_backups_dir: "{{ m_backups }}"
m_data_cache_dir: "{{ m_cache_directory }}"
m_data_logs_dir: "{{ m_logs }}"
m_data_tmp_dir: "{{ m_tmp }}"
m_data_deploy_log_file: "{{ m_logs_deploy }}"

# Web
m_web_dir: "{{ m_htdocs }}"
m_web_conf_dir: "{{ m_apache }}"
m_mediawiki_install_path: "{{ m_mediawiki }}"

# NOTE: Permission and group definitions must also follow the same naming conventions
# for clarity, e.g. m_logs_owner to m_data_logs_dir_owner, etc.
