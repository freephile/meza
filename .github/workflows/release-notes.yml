name: Generate Release Notes and Update Changelog

"on":
  push:
    branches:
      - main
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev
      - develop

jobs:
  update-changelog-and-release-notes:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Check for changes since last changelog update
        id: check_changes
        run: |
          # Get the latest commit hash from CHANGELOG
          LAST_COMMIT=$(grep -P -om 1 'commit ([0-9a-f]{8})' CHANGELOG | head -1 | cut -d' ' -f 2 2>/dev/null || echo "")

          if [ -z "$LAST_COMMIT" ]; then
            echo "No previous commit found in CHANGELOG, will update"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            # Check if there are new commits since the last changelog update
            NEW_COMMITS=$(git rev-list --count ${LAST_COMMIT}..HEAD 2>/dev/null || echo "1")
            if [ "$NEW_COMMITS" -gt "0" ]; then
              echo "Found $NEW_COMMITS new commits since last changelog update"
              echo "needs_update=true" >> $GITHUB_OUTPUT
            else
              echo "No new commits since last changelog update"
              echo "needs_update=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Update CHANGELOG
        if: steps.check_changes.outputs.needs_update == 'true'
        run: |
          chmod +x src/scripts/updateCHANGELOG.sh
          ./src/scripts/updateCHANGELOG.sh
          echo "Changelog updated"

      - name: Generate Release Notes
        if: steps.check_changes.outputs.needs_update == 'true'
        run: |
          chmod +x src/scripts/generate-release-notes.sh

          # Use tag 43.0.0 as the baseline starting point
          START_TAG="43.0.0"
          
          # Verify the tag exists, fallback if needed
          if git rev-parse --verify "$START_TAG" >/dev/null 2>&1; then
            echo "Using baseline tag: $START_TAG"
            ./src/scripts/generate-release-notes.sh "$START_TAG" HEAD
          else
            echo "Baseline tag $START_TAG not found, using first commit"
            # Use the first commit as start reference
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            ./src/scripts/generate-release-notes.sh "$FIRST_COMMIT" HEAD
          fi

          echo "Release notes generated"

      - name: Check if files were changed
        id: check_files
        run: |
          if git diff --quiet HEAD -- CHANGELOG RELEASE_NOTES-HEAD.md; then
            echo "No changes detected"
            echo "files_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in CHANGELOG or RELEASE_NOTES-HEAD.md"
            echo "files_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_files.outputs.files_changed == 'true' && github.event_name == 'push'
        run: |
          git add CHANGELOG RELEASE_NOTES-HEAD.md
          git commit -m "Auto-update CHANGELOG and release notes

          - Updated CHANGELOG with latest commits
          - Generated RELEASE_NOTES-HEAD.md
          - Automated by GitHub Actions"

          git push origin ${{ github.ref_name }}

      - name: Create Pull Request (for PR events)
        if: steps.check_files.outputs.files_changed == 'true' && github.event_name == 'pull_request'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Auto-update CHANGELOG and release notes

            - Updated CHANGELOG with latest commits
            - Generated RELEASE_NOTES-HEAD.md
            - Automated by GitHub Actions
          title: "Auto-update: CHANGELOG and Release Notes"
          body: |
            This PR was automatically created to update the CHANGELOG and release notes.

            ## Changes Made
            - ✅ Updated `CHANGELOG` with latest commit history
            - ✅ Generated `RELEASE_NOTES-HEAD.md` with formatted release notes

            ## Review Notes
            - This is an automated update based on recent commits
            - Please review the generated content for accuracy
            - The changelog follows the existing format used by `updateCHANGELOG.sh`
            - Release notes include commit links and issue references
          branch: auto-update-changelog-${{ github.run_number }}
          delete-branch: true

      - name: Summary
        if: always()
        run: |
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes needed**: ${{ steps.check_changes.outputs.needs_update }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files changed**: ${{ steps.check_files.outputs.files_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event type**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
