---

# ============================================================================
# Role: htdocs
# ============================================================================
# Purpose:
#   Manages web-accessible content in Apache DocumentRoot (/opt/htdocs/)
#
# Runs On:
#   App servers (not localhost) during every deployment
#
# Key Responsibilities:
#   - Sync ServerPerformance monitoring dashboard (always)
#   - Sync BackupDownload interface (conditional on allow_backup_downloads)
#   - Generate web server files (.htaccess, index.php, robots.txt)
#
# File Distribution:
#   - files/ServerPerformance/ → /opt/htdocs/ServerPerformance/ (rsync)
#   - files/BackupDownload/ → /opt/htdocs/BackupDownload/ (rsync, conditional)
#   - templates/*.j2 → /opt/htdocs/*.{php,html,txt,htaccess} (templated)
#
# Compare with configure-wiki:
#   - htdocs: Runtime web content on app servers
#   - configure-wiki: Creates configuration scaffolding on create-wiki (localhost)
# ============================================================================

# @TODO: remove ServerPerformance (deprecated since NetData is available)
# @TODO: remove BackupDownload (risky and backups need separation)

# Take ServerPerformance from controller, put in app server htdocs
- name: Ensure ServerPerformance configured
  ansible.posix.synchronize:
    src: "files/ServerPerformance/"
    dest: "{{ m_htdocs }}/ServerPerformance"
    recursive: true
    delete: true
    rsync_opts:
      - "--no-motd"
      - "--exclude=.git"

- name: Ensure BackupDownload configured
  ansible.posix.synchronize:
    src: "files/BackupDownload/"
    dest: "{{ m_htdocs }}/BackupDownload"
    recursive: true
    delete: true
    rsync_opts:
      - "--no-motd"
      - "--exclude=.git"
  when: allow_backup_downloads

# In case people change their mind and don't want to offer backup downloads,
# remove files
- name: Ensure BackupDownload NOT configured
  ansible.builtin.file:
    path: "{{ m_htdocs }}/BackupDownload"
    state: absent
  when: not allow_backup_downloads

# Sync project-wide logo assets to htdocs for wiki branding
# All branding assets in web root for simplicity
- name: Ensure project-wide branding assets in web root
  ansible.builtin.copy:
    src: "{{ m_meza }}/src/roles/configure-wiki/files/{{ item }}"
    dest: "{{ m_htdocs }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  with_items:
    - "apple-touch-icon.png"
    - "favicon.ico"
    - "meza-icon-50.svg"
    - "meza-logo-135.png"
    - "meza-logo-1.5x.png"
    - "meza-logo-2x.png"

# @TODO: change explicit owner/group to variables and mode to m_htdocs_mode
- name: Ensure files configured
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ m_htdocs }}/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  with_items:
    - ".htaccess"
    - "index.php"
    - "office.html"
    - "robots.txt"
