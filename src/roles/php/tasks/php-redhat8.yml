---

## @TODO remove this, or extract it to a 'clean old host' role?
- name: Remove IUS Repo since we're at distro 8+
  package:
    name: "ius-release"
    state: absent

# @FIXME just include Jeff Geerling's role in site.yaml
# https://github.com/geerlingguy/ansible-role-repo-remi
# Do the same for EPEL
- name: Import remi GPG key.
  rpm_key:
    key: "{{ remi_repo_gpg_key_url }}"
    state: present

- name: Ensure Remi repo installed
  dnf:
    name: "{{ remi_repo_url }}"
    state: present

# surprisingly, Ansible dnf module doesn't work with 'module' command
# https://www.reddit.com/r/ansible/comments/13xdt6h/enabling_dnf_modules_through_ansible/
- name: Get enabled PHP module stream
  ansible.builtin.shell: set -o pipefail; dnf module list --enabled php 2>/dev/null | awk '$1=="php"{print $2}'
  args:
    executable: /bin/bash
  register: php_enabled_stream
  changed_when: false
  failed_when: false

- name: Reset PHP module if a different stream is enabled
  ansible.builtin.command: dnf -y module reset php
  when:
    - php_enabled_stream.stdout | trim | length > 0
    - php_enabled_stream.stdout | trim != php_version
  register: php_reset
  changed_when: true

- name: Enable PHP module stream {{ php_version }}
  ansible.builtin.command: dnf -y module enable php:{{ php_version }}
  when: php_enabled_stream.stdout | trim != php_version
  changed_when: true

# Always track the latest 8.x release within the stream
# 'dnf upgrade' only touches packages that are already installed, unlike
# the dnf module with name 'php*' which would try to install every php package
- name: Upgrade installed PHP packages to latest in stream
  ansible.builtin.command: dnf -y upgrade --refresh php php-*
  register: php_upgrade
  changed_when: "'Nothing to do' not in php_upgrade.stdout"
  notify:
    - restart apache
    - restart php-fpm

- name: Remove stale memcached PECL extension after stream change  # noqa no-handler
  ansible.builtin.file:
    path: /etc/php.d/40-memcached.ini
    state: absent
  when: php_reset is changed

- name: Ensure PHP packages for Rocky/RHEL8 installed
  package:
    name:
      - php-cli
      - php-common
      - php-devel
      - php-gd
      - php-json
      - php-snmp
      - php-xml
      - php-xmlrpc
      - php-mysqlnd
      - php-pdo
      - php-odbc
      - php-process
      - php-bcmath
      - php-intl
      - php-opcache
      - php-soap
      - php-sodium #  required for phpSimpleSAML
      - php-mbstring
      - php-ldap
      - php-fpm
      - php-pear
    state: present

- name: install libmemcached-devel
  dnf:
    name: libmemcached-devel
    state: present
    enablerepo: devel

# PHP memcached extension needed for SAML auth
- name: Ensure PEAR channel up-to-date
  shell: pear channel-update pecl.php.net

- name: Check if memcached PECL extension is installed
  shell: php -m | grep -i memcached
  register: memcached_pecl_installed
  changed_when: false
  failed_when: false

# --configureoptions parameter is not supported in our version of pecl.
- name: Install memcached PECL packages
  shell: >
    printf 'no\nno\nno\nno\nno\nno\nno\nyes\nyes\n' |
    pecl install -f memcached
  when: memcached_pecl_installed.stdout == ""
  notify:
    - restart apache
    - restart php-fpm

- template:
    src: 40-memcached.ini.j2
    dest: /etc/php.d/40-memcached.ini
    owner: root
    group: root
    mode: '0644'
  notify:
    - restart apache
    - restart php-fpm
