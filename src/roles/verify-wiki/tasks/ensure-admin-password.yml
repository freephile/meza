---
# Ensures admin_password is defined and meets MediaWiki requirements. https://meta.wikimedia.org/wiki/Password_policy
# Can be called from interactive playbooks (after vars_prompt) or automated
# deployments (without user input).
#
# Input: admin_password (optional - will be generated if not provided)
# Output: admin_password (validated), admin_password_was_generated (boolean)

- name: Validate admin_password if provided
  ansible.builtin.fail:
    msg: |
      Admin password does not meet MediaWiki requirements:
      - Minimum 10 characters
      - Must contain at least one uppercase letter
      - Must contain at least one lowercase letter
      - Must contain at least one number
      - Must contain at least one special character (!@#$%^&*()_+-=[]{}|;:,.<>?)
      - Cannot contain spaces

      Please provide a valid password or leave blank to auto-generate.
  when: >
    admin_password is defined and
    admin_password | length > 0 and
    (
      admin_password | length < 10 or
      admin_password is not regex('[A-Z]') or
      admin_password is not regex('[a-z]') or
      admin_password is not regex('[0-9]') or
      admin_password is not regex('[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]') or
      ' ' in admin_password
    )
  run_once: true

- name: Generate admin_password when none provided or invalid
  ansible.builtin.set_fact:
    admin_password: "{{ lookup('password', '/dev/null length=10 chars=ascii_letters,digits,punctuation') }}"
    admin_password_was_generated: true
  when: admin_password is not defined or admin_password | length == 0
  until: >
    admin_password | length >= 10 and
    admin_password is regex('[A-Z]') and
    admin_password is regex('[a-z]') and
    admin_password is regex('[0-9]') and
    admin_password is regex('[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]') and
    (' ' not in admin_password)
  retries: 3
  delay: 0

- name: Mark password as user-provided (not generated)
  ansible.builtin.set_fact:
    admin_password_was_generated: false
  when: >
    admin_password is defined and
    admin_password | length > 0 and
    (admin_password_was_generated is not defined or not admin_password_was_generated)
  run_once: true
