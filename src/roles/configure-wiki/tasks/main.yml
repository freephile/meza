---

# inputs:
#   wiki_id
#   wiki_name
#
# all this role needs to do is put a directory named whatever wiki_id is at
# /opt/conf-meza/public/wikis/<wiki_id>
#
# This role DOES NOT actually deploy the wiki to app servers or database
# servers. It simply puts it into configuration. Subsequently it can be
# deployed.
#
# This directory needs to have some minimum requirements:
#   logo.png (is .jpg also allowed?)
#   original.png (is .jpg also allowed? Is this really required?)
#   favicon.ico
#   preLocalSettings.php
#   postLocalSettings.php

# e.g. /opt/conf-meza/public/wikis/foo
- name: Ensure wiki directory exists in config
  ansible.builtin.file:
    path: "{{ m_local_public }}/wikis/{{ wiki_id }}"
    state: directory
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0775'
  delegate_to: localhost
  run_once: true

# @FIXME: do we really need this to be world-writable?
# Pretty sure that we need to allow apache, meza-ansible, and local 'userx'
# to run scripts that write to this directory.
# like update.php or rebuildData.php.
# We could document proper 'usage' so that any local user running scripts
# must use sudo -u apache for MediaWiki "web" scripts or sudo -u meza-ansible
# for Meza shell scripts (but could those create ownership problems?)
# Need better documentation on the permissions in Meza
# Note: X in symbolic mode means execute a directory, but not files.
# Nobody but Apache can write to mw-temp, so it's not suitable for .smw.json

- name: Ensure .smw.json file exists in the conf directory
  ansible.builtin.file:
    path: "{{ m_local_public }}/wikis/{{ wiki_id }}/.smw.json"
    state: touch
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: "u=rw,g=rw,o=r"
  delegate_to: localhost
  run_once: true

# This will make sure the wiki has some required files, but if they exist
# already it will not overwrite them.
- name: Ensure base files are in place (but do not overwrite)
  copy:
    src: "files/{{ item }}"
    dest: "{{ m_local_public }}/wikis/{{ wiki_id }}/{{ item }}"
    # force=no: this will not overwrite
    force: false
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0755'
  with_items:
    - favicon.ico
    - logo.png
  delegate_to: localhost
  run_once: true

- name: Ensure wiki pre/post settings directories exists in config
  ansible.builtin.file:
    path: "{{ m_local_public }}/wikis/{{ wiki_id }}/{{ item }}"
    state: directory
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0755'
  delegate_to: localhost
  run_once: true
  with_items:
    - preLocalSettings.d
    - postLocalSettings.d
    - samlAuthorizations.d

- name: Ensure base templates are present (but do not overwrite)
  template:
    src: "templates/{{ item }}.j2"
    dest: "{{ m_local_public }}/wikis/{{ wiki_id }}/{{ item }}"
    # force=no: Non-default for templates. Destination files will not be overwritten
    force: false
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0755'
  with_items:
    - preLocalSettings.d/base.php
    - preLocalSettings.d/README.md
    - postLocalSettings.d/README.md
    - samlAuthorizations.d/base.php
  delegate_to: localhost
  run_once: true

# Auto-add to declarative wiki configuration
- name: Check if using declarative wiki configuration
  stat:
    path: "{{ m_local_public }}/public.yml"
  register: public_yml_exists
  delegate_to: localhost
  run_once: true

- name: Create public.yml if it doesn't exist (to support declarative wikis)
  copy:
    content: |
      ---
      # Auto-created public.yml for declarative wiki configuration
      # Add environment-specific configuration here
    dest: "{{ m_local_public }}/public.yml"
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0644'
    force: false
  when: not public_yml_exists.stat.exists
  delegate_to: localhost
  run_once: true

- name: Read current public.yml configuration
  slurp:
    src: "{{ m_local_public }}/public.yml"
  register: public_yml_content
  delegate_to: localhost
  run_once: true

- name: Parse and update public.yml with new wiki
  block:
    - name: Parse existing YAML configuration
      set_fact:
        current_config: "{{ public_yml_content['content'] | b64decode | from_yaml }}"
      when: public_yml_content is defined

    - name: Initialize wikis list if not present
      set_fact:
        updated_wikis: "{{ current_config.wikis | default([]) }}"
      when: current_config is defined

    - name: Add new wiki to configuration (if not already present)
      set_fact:
        updated_wikis: "{{ updated_wikis + [{'id': wiki_id, 'name': wiki_name, 'primary': false}] }}"
      when: 
        - current_config is defined
        - updated_wikis | selectattr('id', 'equalto', wiki_id) | list | length == 0

    - name: Update configuration with new wiki
      set_fact:
        updated_config: "{{ current_config | combine({'wikis': updated_wikis}, recursive=true) }}"
      when: current_config is defined and updated_wikis is defined

    - name: Write updated public.yml configuration
      copy:
        content: "{{ updated_config | to_nice_yaml(indent=2) }}"
        dest: "{{ m_local_public }}/public.yml"
        owner: "{{ user_apache }}"
        group: "{{ group_apache }}"
        mode: '0644'
        backup: true
      when: updated_config is defined
      delegate_to: localhost
      run_once: true
      
    - name: Display wiki addition notice
      debug:
        msg: |
          Wiki '{{ wiki_id }}' has been automatically added to declarative configuration.
          If you want to make it the primary wiki, edit {{ m_local_public }}/public.yml
          and set 'primary: true' for this wiki.
      when: current_config is defined
      
  # Always run this block now since we ensure public.yml exists above
  delegate_to: localhost
  run_once: true
