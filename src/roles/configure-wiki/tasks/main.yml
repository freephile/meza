---

# ============================================================================
# Role: configure-wiki
# ============================================================================
# Purpose:
#   Creates configuration scaffold for new wikis in /opt/conf-meza/public/wikis/
#
# Triggered By:
#   meza create wiki <env>
#
# Required Variables (from prompt):
#   wiki_id: Short wiki identifier (e.g., 'demo', 'en')
#   wiki_name: Human-readable name (e.g., 'Demo Wiki')
#
# What It Does:
#   - Creates wiki config directory structure
#   - Copies default logos, favicons
#   - Creates PHP customization directories (preLocalSettings.d, etc.)
#   - Registers wiki in public.yml for declarative configuration
#
# What It Does NOT Do:
#   - Deploy to app/database servers (use 'meza deploy' afterwards)
#   - Create MediaWiki database tables (handled by setup-wiki role)
#
# ============================================================================

# Create /opt/conf-meza/public/wikis/<wiki_id> directory
- name: Ensure wiki directory exists in the config hierarchy
  ansible.builtin.file:
    path: "{{ m_conf_public_dir }}/wikis/{{ wiki_id }}"
    state: directory
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0775'
  delegate_to: localhost
  run_once: true

# Give SMW's "setup information file" a home
# https://www.semantic-mediawiki.org/wiki/Help:Setup_information_file
- name: Ensure .smw.json file exists in the conf directory
  ansible.builtin.file:
    path: "{{ m_conf_public_dir }}/wikis/{{ wiki_id }}/.smw.json"
    state: touch
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: "u=rw,g=rw,o=r"
  delegate_to: localhost
  run_once: true

# This will make sure the wiki has some required files, but if they exist
# already it will not overwrite them.
- name: Ensure base files are in place (but do not overwrite)
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "{{ m_conf_public_dir }}/wikis/{{ wiki_id }}/{{ item }}"
    # local wikis can "manually" customize these files later, so do not overwrite
    force: false
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0775'
  with_items:
    # the logo file has been updated, but we don't force it to update here, because the wiki may have customized it
    # already. Delete the file on the controller if you want to receive the new logo.
    - logo.png
    - apple-touch-icon.png
    - favicon.ico
    - meza-icon-50.svg
    - meza-logo-135.png
    - meza-logo-1.5x.png
    - meza-logo-2x.png
  delegate_to: localhost
  run_once: true

- name: Ensure wiki pre/post settings directories exists in config
  ansible.builtin.file:
    path: "{{ m_conf_public_dir }}/wikis/{{ wiki_id }}/{{ item }}"
    state: directory
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0775'
  delegate_to: localhost
  run_once: true
  with_items:
    - preLocalSettings.d
    - postLocalSettings.d
    - samlAuthorizations.d

- name: Ensure base templates are present (overwrite)
  ansible.builtin.template:
    src: "templates/{{ item }}.j2"
    dest: "{{ m_conf_public_dir }}/wikis/{{ wiki_id }}/{{ item }}"
    # force update "distribution" content, that instructs user to customize
    # with their own files
    force: true
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0775'
  with_items:
    - preLocalSettings.d/base.php.dist
    - preLocalSettings.d/README.md
    - postLocalSettings.d/README.md
    - samlAuthorizations.d/base.php.dist
  delegate_to: localhost
  run_once: true

# Auto-add to declarative wiki configuration
- name: Check if using declarative wiki configuration
  ansible.builtin.stat:
    path: "{{ m_conf_public_dir }}/public.yml"
  register: public_yml_exists
  delegate_to: localhost
  run_once: true

- name: Create public.yml if it doesn't exist (to support declarative wikis)
  ansible.builtin.copy:
    content: |
      ---
      # Auto-created public.yml for declarative wiki configuration
      # Add environment-specific configuration here
    dest: "{{ m_conf_public_dir }}/public.yml"
    owner: "{{ user_apache }}"
    group: "{{ group_apache }}"
    mode: '0664'
    force: false
  delegate_to: localhost
  run_once: true
  when: not public_yml_exists.stat.exists

- name: Read current public.yml configuration
  ansible.builtin.slurp:
    src: "{{ m_conf_public_dir }}/public.yml"
  register: public_yml_content
  delegate_to: localhost
  run_once: true

- name: Parse and update public.yml with new wiki
  # Always run this block now since we ensure public.yml exists above
  delegate_to: localhost
  run_once: true
  block:
    - name: Parse existing YAML configuration
      ansible.builtin.set_fact:
        current_config: "{{ public_yml_content['content'] | b64decode | from_yaml }}"
      when: public_yml_content is defined

    - name: Initialize wikis list if not present
      ansible.builtin.set_fact:
        updated_wikis: "{{ current_config.wikis | default([]) }}"
      when: current_config is defined

    - name: Add new wiki to configuration (if not already present)
      ansible.builtin.set_fact:
        updated_wikis: "{{ updated_wikis + [{'id': wiki_id, 'name': wiki_name, 'primary': false}] }}"
      when:
        - current_config is defined
        - updated_wikis | selectattr('id', 'equalto', wiki_id) | list | length == 0

    - name: Update configuration with new wiki
      ansible.builtin.set_fact:
        updated_config: "{{ current_config | combine({'wikis': updated_wikis}, recursive=true) }}"
      when: current_config is defined and updated_wikis is defined

    - name: Write updated public.yml configuration
      ansible.builtin.copy:
        content: "{{ updated_config | to_nice_yaml(indent=2) }}"
        dest: "{{ m_conf_public_dir }}/public.yml"
        owner: "{{ user_apache }}"
        group: "{{ group_apache }}"
        mode: '0664'
        backup: true
      when: updated_config is defined
      delegate_to: localhost
      run_once: true

    - name: Display wiki addition notice
      ansible.builtin.debug:
        msg: |
          Wiki '{{ wiki_id }}' has been automatically added to declarative configuration.
          If you want to make it the primary wiki, edit {{ m_conf_public_dir }}/public.yml
          and set 'primary: true' for this wiki.
      when: current_config is defined
