- name: Include CirrusSearch metastore upgrade and templates (if requested)
  ansible.builtin.include_tasks: cirrus_metastore_upgrade.yml
  when:
    - (mediawiki_cirrus_metastore_upgrade | default(false)) | bool
    - docker_skip_tasks is not defined or not docker_skip_tasks
