---

- name: Delete wiki from controller
  file:
    path: "{{ m_local_public }}/wikis/{{ wiki_id }}"
    state: absent
  delegate_to: localhost

# Ensure app servers have this change
- name: Sync configurations (FIXME do we need this)
  include_role:
    name: sync-configs

# FIXME: Shouldn't this not be required?
- name: Delete htdocs directory
  file:
    path: "{{ m_htdocs }}/wikis/{{ wiki_id }}"
    state: absent

- name: Delete wiki uploads directory and gluster brick
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ m_uploads_dir }}/{{ wiki_id }}"
    - "{{ gluster_brick_dir }}/{{ wiki_id }}"


# Auto-remove from declarative wiki configuration  
- name: Check if using declarative wiki configuration
  stat:
    path: "{{ m_local_public }}/public.yml"
  register: public_yml_exists
  delegate_to: localhost
  run_once: true

- name: Read current public.yml configuration
  slurp:
    src: "{{ m_local_public }}/public.yml"
  register: public_yml_content
  when: public_yml_exists.stat.exists
  delegate_to: localhost
  run_once: true

# We manipulate only the 'wikis' section of the YAML to remove the deleted wiki
- name: Remove wiki from declarative configuration
  block:
    - name: Parse existing YAML configuration
      set_fact:
        current_config: "{{ public_yml_content['content'] | b64decode | from_yaml }}"
      when: public_yml_content is defined

    - name: Remove wiki from configuration
      set_fact:
        updated_wikis: "{{ current_config.wikis | default([]) | rejectattr('id', 'equalto', wiki_id) | list }}"
      when: current_config is defined

    - name: Update configuration without deleted wiki
      set_fact:
        updated_config: "{{ current_config | combine({'wikis': updated_wikis}, recursive=true) }}"
      when: current_config is defined and updated_wikis is defined

    - name: Write updated public.yml configuration
      copy:
        content: "{{ updated_config | to_nice_yaml(indent=2) }}"
        dest: "{{ m_local_public }}/public.yml"
        owner: "{{ user_apache }}"
        group: "{{ group_apache }}"
        mode: '0644'
        backup: true
      when: updated_config is defined
      delegate_to: localhost
      run_once: true
      
    - name: Display wiki removal notice
      debug:
        msg: "Wiki '{{ wiki_id }}' has been automatically removed from declarative configuration."
      when: current_config is defined
      
  when: public_yml_exists.stat.exists
  delegate_to: localhost
  run_once: true

# Cleanup elasticsearch
# FIXME: Does this need to happen on all ES servers, or just one?
- name: Delete Elasticsearch indices
  shell: "{{ item }}"
  delegate_to: "{{ groups['elastic_servers'][0] }}"
  with_items:
    - curl -XDELETE "localhost:9200/wiki_{{ wiki_id }}_general_first/"
    - curl -XDELETE "localhost:9200/wiki_{{ wiki_id }}_content_first/"
    - curl -XDELETE "localhost:9200/wiki_{{ wiki_id }}_general/"

# Delete database
- name: Drop database from master DB
  community.mysql.mysql_db:
    name: "wiki_{{ wiki_id }}"
    state: absent
  delegate_to: "{{ groups['db_master'][0] }}"
