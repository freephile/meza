# [1] This should only be run the first time (on the first app server) since on
# subsequent passes the controller is guaranteed to have a local config.
- name: Does controller have local config
  ansible.builtin.stat:
    path: "{{ m_local_public }}"
  register: controller_local_config

# If a git repo is defined use that for config
- name: Get local config repo if set
  become: true
  become_user: "meza-ansible"
  # Ref #1149 for TMPDIR environment var
  environment:
    TMPDIR: "{{ m_tmp }}"
  ansible.builtin.git:
    repo: "{{ local_config_repo.repo }}"
    dest: "{{ m_local_public }}"
    version: "{{ local_config_repo.version | default('master') }}"
    force: "{{ local_config_repo.force | default(false) | bool }}"
    umask: "{{ m_umask }}"
  when:
    not controller_local_config.stat.exists
    and local_config_repo.repo is defined

# After all that, now check if controller has a local config
# (not sure if I should reuse controller_local_config here)
# @TODO: refactor. The registered variable is never used. The comment indicates
# some other code should be used. The whole thing is messy.
# Also, the role name should be refactored because it runs on every play and
# every server, not just the controller.
# This role might be eliminated entirely as part of a larger refactor.
# GetMeza does too much. Permisions and Bootstrapping must be separate roles. Apache needs to be installed EARLY, and separate from 'mediawiki-app' and 'php'. ansible_user membership in 'group_apache' should be handled when apache is installed, not here.
- name: Does controller have local config
  ansible.builtin.stat:
    path: "{{ m_local_public }}"
  register: recheck_controller

# Apache guaranteed to exist due to bootstrap sequencing (Issue #287)
- name: Verify Apache group exists
  ansible.builtin.command: getent group {{ group_apache }}
  register: apache_group_check
  changed_when: false
  check_mode: false
  failed_when: apache_group_check.rc != 0

# ensure the m_local directory exists on the controller and is configured properly
- name: Ensure m_local_public configured on controller
  ansible.builtin.file:
    path: "{{ m_local_public }}"
    state: directory
    owner: "{{ m_config_public_owner }}"
    group: "{{ group_apache }}"
    mode: "{{ m_config_public_mode }}"
  tags:
    - file-perms


# Ensure that the 'wikis' directory exists within m_local_public
# Note: ownership will be set later after apache user is created
- name: "Ensure m_local_public/wikis exists"
  file:
    path: "{{ m_local_public }}/wikis"
    state: directory
    mode: "{{ m_config_public_mode }}"

- name: Ensure pre/post/saml settings directories exists in config
  ansible.builtin.file:
    path: "{{ m_local_public }}/{{ item }}"
    state: directory
    owner: "{{ m_config_public_owner }}"
    group: "{{ m_config_public_group }}"
    mode: "{{ m_config_public_mode }}"
  with_items:
    - preLocalSettings.d
    - postLocalSettings.d
    - samlAuthorizations.d

- name: "Ensure base files present, do NOT overwrite"
  ansible.builtin.template:
    src: "templates/{{ item }}.j2"
    dest: "{{ m_local_public }}/{{ item }}"
    owner: "{{ m_config_public_owner }}"
    group: "{{ m_config_public_group }}"
    mode: "{{ m_config_public_mode }}"
    force: false
  with_items:
    - MezaLocalExtensions.yml
    - MezaLocalSkins.yml
    - public.yml

- name: "Ensure meza directory properly owned: {{ m_meza }}"
  ansible.builtin.file:
    path: "{{ m_meza }}"
    owner: "meza-ansible"
    group: "{{ m_group }}"
    state: directory
    recurse: true
  tags:
    - file-perms

- name: "Ensure secret directories properly owned/moded: {{ m_local_secret }}"
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ m_config_secret_owner }}"
    group: "{{ m_config_secret_group }}"
    mode: "{{ m_config_secret_dir_mode }}"
    state: directory
  tags:
    - file-perms
  with_items:
    - "{{ m_local_secret }}"
    - "{{ m_local_secret }}/{{ env }}"

- name: "Ensure secret files properly owned/moded: {{ m_local_secret }}"
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ m_config_secret_owner }}"
    group: "{{ m_config_secret_group }}"
    mode: "{{ m_config_secret_file_mode }}"
    state: file
  tags:
    - file-perms
  with_items:
    - "{{ m_local_secret }}/{{ env }}/secret.yml"
    - "{{ m_local_secret }}/{{ env }}/hosts"
