---
#
# General-purpose MediaWiki maintenance script runner
#
# This playbook can run any MediaWiki maintenance script across all wikis or specific wikis.
#
# Required variables:
#   maintenance_script: Name of the maintenance script (with or without .php extension)
#
# Optional variables:
#   maintenance_args: Arguments to pass to the maintenance script
#   target_wiki: Run script on specific wiki only (defaults to all wikis)
#
# Examples:
#   # Run cleanupUploadStash.php on all wikis
#   ansible-playbook run-maintenance.yml -e "maintenance_script=cleanupUploadStash"
#
#   # Run runJobs.php with arguments on all wikis
#   ansible-playbook run-maintenance.yml -e "maintenance_script=runJobs" -e "maintenance_args=--maxjobs=10"
#
#   # Run update.php on specific wiki
#   ansible-playbook run-maintenance.yml -e "maintenance_script=update" -e "target_wiki=demo"
#
#   # Run refreshLinks.php with verbose output on specific wiki
#   ansible-playbook run-maintenance.yml -e "maintenance_script=refreshLinks" -e "maintenance_args=--verbose" -e "target_wiki=mywiki"
#

- name: Run MediaWiki maintenance scripts
  hosts: app_servers
  become: true
  tasks:

    - name: Set vars
      ansible.builtin.include_role:
        name: set-vars
      tags:
        - always

    - name: Validate required parameters
      ansible.builtin.fail:
        msg: "maintenance_script variable is required. Use --extra-vars 'maintenance_script=scriptname'"
      when: maintenance_script is not defined

    - name: Get individual wikis dirs from localhost
      ansible.builtin.find:
        paths: "{{ m_local_public }}/wikis/"
        file_type: directory
      register: wikis_dirs
      delegate_to: localhost
      run_once: true

    - name: Set fact - list of wikis
      ansible.builtin.set_fact:
        list_of_wikis: "{{ wikis_dirs.files | map(attribute='path') | map('basename') | list }}"

    - name: Set fact - maintenance script with extension
      ansible.builtin.set_fact:
        script_name: "{{ maintenance_script if maintenance_script.endswith('.php') else maintenance_script + '.php' }}"

    - name: Set fact - script arguments
      ansible.builtin.set_fact:
        script_args: "{{ maintenance_args | default('') }}"

    - name: Set fact - target wikis
      ansible.builtin.set_fact:
        target_wikis: "{{ [target_wiki] if target_wiki is defined else list_of_wikis }}"

    - name: Display maintenance operation info
      ansible.builtin.debug:
        msg:
          - "Running maintenance script: {{ script_name }}"
          - "Script arguments: {{ script_args }}"
          - "Target wikis: {{ target_wikis | join(', ') }}"
      run_once: true

    - name: Run MediaWiki maintenance script
      ansible.builtin.shell: |
        set -o pipefail
        WIKI={{ item | quote }} {{ m_mediawiki | quote }}/maintenance/run {{ script_name | quote }} {{ script_args }}
      args:
        executable: /bin/bash
      with_items: "{{ target_wikis }}"
      register: maintenance_result
      changed_when: true

    - name: Display maintenance script output
      ansible.builtin.debug:
        msg:
          - "Wiki: {{ item.item }}"
          - "Exit code: {{ item.rc }}"
          - "Output: {{ item.stdout }}"
          - "Errors: {{ item.stderr if item.stderr else 'None' }}"
      with_items: "{{ maintenance_result.results }}"
      when: maintenance_result is defined
